name: novel_reader
description: "Gac Truyen - doc tieu thuyet mang Trung Quoc dich sang tieng Viet bang LLM."
publish_to: 'none'
version: 1.0.24+25

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  google_fonts: ^8.1.0
  palette_generator: ^0.3.3
  # Đọc offline: sqflite (Android/iOS) + ffi (Windows/Linux/macOS dev) + path cho join()
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  # Nghe truyện: TTS hệ thống đọc bản dịch (iOS giọng Việt khá, Android tuỳ máy)
  flutter_tts: ^4.2.0
  # Tu luyện: md5 xác định chương có quà (mirror công thức SQL cult_gift_at)
  crypto: ^3.0.6
  # Cập nhật trong app: so version với GitHub Releases + mở link tải APK
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  lottie: ^3.5.1
  wakelock_plus: ^1.5.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Icon app "Gác Truyện" — GT thư pháp trên nền chàm. Sinh lại:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_launcher_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/ic_fg_1024.png"
  adaptive_icon_monochrome: "assets/icon/ic_fg_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    # font google_fonts bundle sẵn (test + lần chạy đầu không cần mạng)
    - assets/google_fonts/
    - assets/icon/gt_ink.png     # logo GT mực đậm — chế độ sáng
    - assets/icon/gt_white.png   # logo GT trắng — chế độ tối
    - assets/hanviet.tsv         # bảng tra Hán-Việt (đồng bộ từ worker/novelworker/data/)

    # cả thư mục (chỉ chứa webp) — thả frame idle phụ _f2.._f4 vào là tự bundle
    - assets/cultivators/
    - assets/bg/cultivation_bg.webp
    - assets/bg/cultivation_bg_night.webp
    - assets/cult_fx/
    - assets/cult_items/
    - assets/cult_halo/            # trận pháp hào quang hậu Phi Thăng (webp có alpha)

  # Fragment shader hiệu ứng Độ Kiếp/đại cảnh giới (nấc 2 — bloom + godray)
  shaders:
    - shaders/breakthrough.frag
