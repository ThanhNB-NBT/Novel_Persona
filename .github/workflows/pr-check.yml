# Kiểm tra chất lượng trên mỗi PR: flutter analyze + pytest worker.
# Chặn merge khi có lỗi/warning mới — enforce quy tắc "Bất di bất dịch" mục 1.

name: PR quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  database-migrations:
    name: Supabase migrations sạch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Áp toàn bộ migration lên database mới
        run: supabase start

  flutter-analyze:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (0 lỗi, 0 warning)
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --no-pub

  worker-test:
    name: Worker pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt pytest

      - name: Pytest (không cần mạng/LLM)
        run: python -m pytest test/ -x -q --tb=short
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          NVIDIA_API_KEY: "placeholder"
